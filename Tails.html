<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Tails</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="tails.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Comfortaa:wght@300..700&family=Monoton&family=Orbitron:wght@400..900&family=Pacifico&display=swap" rel="stylesheet">
    </head>
    <body>
        <h1>Tail's Slot Machine</h1>

        <div class="slot-wrapper">
            <!-- Foreground layer: transparent PNG frame -->
            <img src="Assets/Images/slotmachine_base.png" class="slot-frame" alt="Slot machine frame">
            
            <!-- Overlay container (on top of reels) -->
            <div class="overlay-container">
                <div class="overlay-sprite"></div>
            </div>
            
            <!-- Reel section goes in the middle -->
            <div class="reel-container">
            <div id = 'reel1' class="reel tails1" ></div>
            <div id = 'reel2' class= "reel tails2"></div>
            <div id = 'reel3' class= "reel tails3" ></div>
            </div>
            <img id='tails-decal-3' src="Assets/Images/tails(5).PNG" height='70px'>
            <img id='tails-decal-2' src="Assets/Images/tails(2).PNG" height='50px'>
            <img id='tails-decal-1' src="Assets/Images/tails(4).PNG" height='50px'>
        </div>
        <!-- contains audio player for tails -->
        <div id="audio-container">
            <audio id="music" controls loop>
                <source src='Assets/Sounds/Tails_Theme.wav' type='audio/wav'>
            </audio>
            </div>
    </body>
</html>
