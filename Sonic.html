<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Sonic</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- 🎨 Styles -->
    <link rel="stylesheet" href="sonic.css">
    <link rel="stylesheet" href="lever.css"> <!-- optional if you separated lever logic -->

    <!-- 🎵 Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Comfortaa:wght@300..700&family=Monoton&family=Orbitron:wght@400..900&family=Pacifico&display=swap" rel="stylesheet">
  </head>

  <body>
    <h1><a href = "Homepage.html"> Sonic’s Slot Machine </a></h1>

    <div class="slot-wrapper">

      <!-- Overlay container (animated Sonic sprite) -->
      <div class="overlay-container">
        <div class="overlay-sprite"></div>
      </div>

      <!-- 🌀 Sonic decals below the slot machine -->
      <img id="sonic-decal-2" src="Assets/Images/sonic(2).png" height="60px" alt="Sonic decal 2">
      <img id="sonic-decal-4" src="Assets/Images/sonic(4).png" height="65px" alt="Sonic decal 4">
      <img id="sonic-decal-5" src="Assets/Images/sonic(5).png" height="70px" alt="Sonic decal 5">

      <!-- Slot machine frame (foreground) -->
      <img src="Assets/Images/slotmachine_base.png" class="slot-frame" alt="Slot machine frame">

      <!-- Hidden toggle input controls the reel animation -->
      <input type="checkbox" id="lever-toggle" hidden>

      <!-- Clickable lever area (invisible, overlaid on frame) -->
      <label for="lever-toggle" class="spin-lever"></label>

      <!-- Reels (centered inside slot machine) -->
      <div class="reel-container">
        <div class="reel sonic1"></div>
        <div class="reel sonic2"></div>
        <div class="reel sonic3"></div>
      </div>
    </div>

    <!-- Background Music -->
    <div id="audio-container">
      <audio id="music" controls loop>
        <source src="Assets/Sounds/Sonic_Theme.wav" type="audio/wav">
      </audio>
    </div>
  </body>
</html>
